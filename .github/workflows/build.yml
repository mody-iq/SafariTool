name: Build SafariTool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make git curl fakeroot dpkg-dev \
            libxml2 libplist-dev libssl-dev \
            clang lld zip unzip

      - name: Install ldid
        run: |
          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          git submodule update --init --depth=1
          make CXX=clang++
          sudo cp ./ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Install Theos (RootHide fork)
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install Theos SDKs
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          ls $HOME/theos/sdks

      - name: Build package
        run: |
          make package FINALPACKAGE=1 -j$(nproc)

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafariTool-deb
          path: packages/*.deb
          if-no-files-found: error
