name: Build SafariTool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos (RootHide fork)
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Theos SDKs
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          ls $HOME/theos/sdks

      - name: Install build dependencies
        run: |
          brew install ldid dpkg

      - name: Build package
        run: |
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafariTool-deb
          path: packages/*.deb
          if-no-files-found: error
